# Local WordPress for testing the plugin (OrbStack or Docker Desktop).
#   docker compose -f dev/docker-compose.yml up -d
#   open http://localhost:8090
# The plugin folder is mounted live; Gravity Forms is installed from a zip
# you supply (see docs/developer.md, "Local test site").
name: orbit-gf-dev
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
  wordpress:
    image: wordpress:6-php8.2-apache
    depends_on: [db]
    ports:
      - "8090:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        // Orbit's local API (https://localhost:3122 on the Mac) uses a development certificate.
        define( 'ORBIT_GF_API_URL', getenv( 'ORBIT_GF_API_URL' ) ?: 'https://api.orbitcrm.co.uk' );
        if ( getenv( 'ORBIT_GF_SSL_VERIFY' ) === '0' ) { define( 'ORBIT_GF_SSL_VERIFY', false ); }
      ORBIT_GF_API_URL: ${ORBIT_GF_API_URL:-https://host.docker.internal:3122}
      ORBIT_GF_SSL_VERIFY: "0"
    volumes:
      - wp:/var/www/html
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      # WordPress calls itself at localhost:8090 (Gravity Forms background feeds, WP-Cron).
      - ./listen-8090.conf:/etc/apache2/conf-enabled/listen-8090.conf:ro
      - ..:/var/www/html/wp-content/plugins/orbit-gravity-forms
  cli:
    image: wordpress:cli-php8.2
    profiles: [cli]
    user: "33:33"
    depends_on: [db, wordpress]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      ORBIT_GF_API_URL: ${ORBIT_GF_API_URL:-https://host.docker.internal:3122}
      ORBIT_GF_SSL_VERIFY: "0"
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/orbit-gravity-forms
      - ${GF_ZIP_DIR:-./zips}:/zips:ro
volumes:
  db:
  wp:
