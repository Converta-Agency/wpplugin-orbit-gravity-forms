name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "Version:           ${tag}$" orbit-gravity-forms.php || { echo "Tag ${tag} does not match the plugin header"; exit 1; }
          grep -q "define( 'ORBIT_GF_VERSION', '${tag}' );" orbit-gravity-forms.php || { echo "Tag ${tag} does not match ORBIT_GF_VERSION"; exit 1; }
      - name: Build the plugin zip
        run: |
          mkdir -p build
          git archive --format=tar --prefix=orbit-gravity-forms/ HEAD | tar -x -C build
          (cd build && zip -qr ../orbit-gravity-forms.zip orbit-gravity-forms)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" orbit-gravity-forms.zip --title "Version ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md
